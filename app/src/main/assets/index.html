<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pocket-media.invalid; media-src https://pocket-media.invalid; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Herdr Pocket</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="connection" class="connection">
        <strong class="brand">POCKET</strong><span class="dot"></span
        ><span id="connection-text">연결 중</span><span id="updated"></span>
        <button id="refresh" class="icon-button" aria-label="새로고침"></button>
      </header>
      <main id="main"></main>
      <nav id="nav" aria-label="주 메뉴"></nav>
    </div>
    <section
      id="detail"
      class="detail hidden"
      role="dialog"
      aria-modal="true"
      aria-label="작업 상세"
    ></section>
    <div id="toast" role="status" class="toast hidden"></div>
    <script src="i18n.js"></script>
    <script src="ui.js"></script>
    <script src="transport.js"></script>
    <script src="media.js"></script>
    <script src="message-content.js"></script>
    <script src="app.js"></script>
    <script src="delivery.js"></script>
    <script src="interaction.js"></script>
    <script src="notifications.js"></script>
    <script src="bootstrap.js"></script>
  </body>
</html>
